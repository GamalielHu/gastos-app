<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Cuentas Claras</title>
  <meta name="description" content="Registro de gastos e ingresos por cuenta y por proyecto de obra">
  <meta name="theme-color" content="#16202a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cuentas Claras">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div class="splash"><div class="splash-mark"></div><p>Cargando…</p></div>
  </div>
  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="input-importar-excel" accept=".xlsx,.csv" hidden>
  <input type="file" id="input-restaurar" accept=".json,application/json" hidden>
  <input type="file" id="input-comprobante" accept="image/*" hidden>
  <script type="module" src="js/main.js"></script>
</body>
</html>
