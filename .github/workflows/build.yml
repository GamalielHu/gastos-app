name: Compilar app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: compilar
  cancel-in-progress: true

jobs:
  web:
    name: Versión web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  pages:
    name: Publicar para el iPad
    needs: web
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    name: APK para Android
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Crear proyecto Android
        run: |
          npx cap add android
          cp -r android-res/* android/app/src/main/res/
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          # Firma siempre con tools/debug.keystore (sin esto Gradle crea una clave nueva en cada compilación)
          sed -i "0,/^android {/s//android {\n    signingConfigs { debug { storeFile file('..\/..\/tools\/debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }/" android/app/build.gradle
          grep -n "signingConfigs" android/app/build.gradle
          node tools/android-compartir.mjs
          npx cap sync android
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../CuentasClaras.apk
          keytool -printcert -jarfile ../CuentasClaras.apk | grep SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: CuentasClaras-apk
          path: CuentasClaras.apk
      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Cuentas Claras 1.${{ github.run_number }}
          files: CuentasClaras.apk
          make_latest: true
          body: |
            Descarga **CuentasClaras.apk** en tu celular Android y ábrelo para instalar o actualizar.
            Tus datos están en la nube: actualizar no borra nada.
